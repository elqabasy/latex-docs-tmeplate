name: Release PDF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      engine:
        description: "LaTeX engine to use (pdflatex, xelatex, lualatex)"
        required: false
        default: "xelatex"
        type: choice
        options:
          - pdflatex
          - xelatex
          - lualatex

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover LaTeX entrypoints (\\documentclass)
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src -type f -name '*.tex' -print0)
          roots=()
          for f in "${files[@]}"; do
            if grep -Eq '^[[:space:]]*\\documentclass' "$f"; then
              roots+=("$f")
            fi
          done
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No entrypoint .tex files found under src/ (expected files containing \\documentclass)." >&2
            exit 2
          fi
          {
            echo "root_files<<EOF"
            printf '%s\n' "${roots[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile PDFs (${{ inputs.engine || 'xelatex' }} via latexmk)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.discover.outputs.root_files }}
          latexmk_use_xelatex: ${{ (inputs.engine || 'xelatex') == 'xelatex' }}
          latexmk_use_lualatex: ${{ (inputs.engine || 'xelatex') == 'lualatex' }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=dist

      - name: Prepare release assets
        run: |
          shopt -s nullglob
          pdfs=(dist/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PDFs found in dist/ after build." >&2
            exit 2
          fi
          mkdir -p dist
          for pdf in "${pdfs[@]}"; do
            base="$(basename "$pdf")"
            stem="${base%.pdf}"
            cp -f "$pdf" "dist/${{ github.event.repository.name }}-${{ github.ref_name }}-${stem}.pdf"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.pdf
