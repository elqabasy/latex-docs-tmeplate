name: Release PDF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      engine:
        description: "LaTeX engine to use (pdflatex, xelatex, lualatex)"
        required: false
        default: "xelatex"
        type: choice
        options:
          - pdflatex
          - xelatex
          - lualatex

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile PDF (${{ inputs.engine || 'xelatex' }} via latexmk)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: index.tex
          working_directory: src
          latexmk_use_xelatex: ${{ (inputs.engine || 'xelatex') == 'xelatex' }}
          latexmk_use_lualatex: ${{ (inputs.engine || 'xelatex') == 'lualatex' }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=../dist

      - name: Prepare release assets
        run: |
          test -f dist/index.pdf
          cp -f dist/index.pdf "dist/${{ github.event.repository.name }}-${{ github.ref_name }}.pdf"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.pdf
