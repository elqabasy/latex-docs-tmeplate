name: Build LaTeX

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: "LaTeX engine to use (pdflatex, xelatex, lualatex)"
        required: false
        default: "xelatex"
        type: choice
        options:
          - pdflatex
          - xelatex
          - lualatex

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["pdflatex","xelatex","lualatex"]') || fromJSON('["xelatex"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover LaTeX entrypoints (\\documentclass)
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src -type f -name '*.tex' -print0)
          roots=()
          for f in "${files[@]}"; do
            if grep -Eq '^[[:space:]]*\\documentclass' "$f"; then
              roots+=("${f#src/}")
            fi
          done
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No entrypoint .tex files found under src/ (expected files containing \\documentclass)." >&2
            exit 2
          fi
          {
            echo "root_files<<EOF"
            printf '%s\n' "${roots[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Clean dist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

      - name: Compile PDFs (${{ matrix.engine }} via latexmk)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.discover.outputs.root_files }}
          working_directory: src
          latexmk_use_xelatex: ${{ matrix.engine == 'xelatex' }}
          latexmk_use_lualatex: ${{ matrix.engine == 'lualatex' }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=../dist

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.engine }}-${{ github.sha }}
          path: dist/*.pdf
          if-no-files-found: error
